server {
    listen 80;
    listen [::]:80;
    server_name nl1.gmdns.net;
    location /.well-known/acme-challenge/ { root /var/www/openu60-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nl1.gmdns.net;
    ssl_certificate /etc/openu60-tls/fullchain.pem;
    ssl_certificate_key /etc/openu60-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    access_log off;
    location /openu60/ {
        proxy_pass http://127.0.0.1:46170/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
    location / { return 404; }
}
